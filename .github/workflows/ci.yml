name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.8.0). Empty = git ref name."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/calls-transcriber:${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: make docker-push-parakeet

      - name: Tag latest
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/calls-transcriber:latest" \
            "${{ steps.meta.outputs.image }}"
